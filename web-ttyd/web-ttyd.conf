# nginx front for the browser versions of maze4 and bidet (ttyd).  Installed by
# web-ttyd/install.sh as /etc/nginx/conf.d/web-ttyd.conf.
#
# One https server on the LAN address only, HTTP basic auth on everything, and
# one path per app.  Each ttyd listens on 127.0.0.1 and is started with its
# base path (BASE=/maze4/term, BASE=/bidet/term) so its page and WebSocket live under it.
map $http_upgrade $web_ttyd_connection {
 default upgrade;
 ''      close;
}

server {
 listen 192.168.10.1:8444 ssl;
 include snippets/cpbee-tls.conf;
 server_name _;
 server_tokens off;
 error_page 497 =301 https://$host:$server_port$request_uri;

 auth_basic           "web-ttyd";
 auth_basic_user_file /etc/nginx/web-ttyd.htpasswd;

 # / is the list of apps (index.html).  "rewrite ... break", unlike "return", still goes through the auth check.
 location = / { root /usr/share/web-ttyd; rewrite ^ /index.html break; add_header Cache-Control no-cache; }
 location = /maze4 { return 301 /maze4/; }
 location = /bidet { return 301 /bidet/; }
 location = /cpvax { return 301 /cpvax/; }
 location = /cpvax-console { return 301 /cpvax-console/; }

 # /APP/ is the window frame (a static page); the terminal itself is ttyd at /APP/term/ inside it.
 # "rewrite ... break" (unlike "return") still goes through the auth check.
 location = /maze4/ { root /usr/share/web-ttyd; rewrite ^ /frame.html break; add_header Cache-Control no-cache; }
 location = /bidet/ { root /usr/share/web-ttyd; rewrite ^ /frame.html break; add_header Cache-Control no-cache; }

 location /maze4/term/ {
  proxy_pass http://127.0.0.1:7681;
  include snippets/web-ttyd-proxy.conf;
 }
 location /bidet/term/ {
  proxy_pass http://127.0.0.1:7682;
  include snippets/web-ttyd-proxy.conf;
 }

 location = /cpvax/ { root /usr/share/web-ttyd; rewrite ^ /frame.html break; add_header Cache-Control no-cache; }
 location /cpvax/term/ {
  proxy_pass http://127.0.0.1:7683;
  include snippets/web-ttyd-proxy.conf;
 }
 location = /cpvax-console/ { root /usr/share/web-ttyd; rewrite ^ /frame.html break; add_header Cache-Control no-cache; }
 location /cpvax-console/term/ {
  proxy_pass http://127.0.0.1:7684;
  include snippets/web-ttyd-proxy.conf;
 }
}
