# The proxy headers both ttyd locations share.  Installed by web-ttyd/install.sh
# as /etc/nginx/snippets/web-ttyd-proxy.conf.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $web_ttyd_connection;
proxy_set_header X-Forwarded-Proto https;
# a session is one long WebSocket; do not let nginx time it out while a viewer watches
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
