# A cut-down Ergo default.yaml for the tests: every block configure-ergo.sh
# changes, exactly as Ergo 2.19.1 ships it, with a little around each.
# (Ergo is MIT-licensed; https://github.com/ergochat/ergo)

# network configuration
network:
    # name of the network
    name: ErgoTest

# server configuration
server:
    # server name
    name: ergo.test

    # addresses to listen on
    listeners:
        "127.0.0.1:6667": # (loopback ipv4, localhost-only)
        "[::1]:6667":     # (loopback ipv6, localhost-only)

        # The standard SSL/TLS port for IRC is 6697. This will listen on all interfaces:
        ":6697":
            # this is a standard TLS configuration with a single certificate;
            # see the manual for instructions on how to configure SNI
            tls:
                cert: fullchain.pem
                key: privkey.pem
            proxy: false
            min-tls-version: 1.2

        # Example of a WebSocket listener:
        # ":8097":
        #     websocket: true
        #     tls:
        #         cert: fullchain.pem
        #         key: privkey.pem

    # the motd
    motd: ergo.motd

# languages config
languages:
    # whether to load languages
    enabled: true

    # which directory contains our language files
    path: languages
